<?xml version="1.0" encoding="UTF-8"?>
<!-- AgoyNotch app icon: original stylised skull on a dark rounded square.
     Editable source; scripts/make-icon.py renders the same geometry to AppIcon.png. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B3F47"/>
      <stop offset="1" stop-color="#141519"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" ry="184" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Skull: cranium + jaw -->
  <g fill="#F1EEE6">
    <circle cx="512" cy="480" r="245"/>
    <rect x="352" y="560" width="320" height="200" rx="60" ry="60"/>
  </g>

  <!-- Cavities -->
  <g fill="#1A1B20">
    <ellipse cx="420" cy="540" rx="72" ry="80"/>
    <ellipse cx="604" cy="540" rx="72" ry="80"/>
    <polygon points="512,615 482,672 542,672"/>
    <rect x="392" y="706" width="240" height="14"/>
    <rect x="450" y="706" width="14" height="54"/>
    <rect x="505" y="706" width="14" height="54"/>
    <rect x="560" y="706" width="14" height="54"/>
  </g>
</svg>
